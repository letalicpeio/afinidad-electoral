name: Verificar cálculo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.mjs
      - run: node --check programas.mjs
      - run: node programas.test.mjs
      - run: node scoring.test.mjs
      - run: node --check charts.mjs
      - run: node --check share.mjs
      - run: node charts.test.mjs
