name: Obtener programa (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL del PDF
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" -o p.pdf "${{ inputs.url }}"
          ls -l p.pdf; head -c 8 p.pdf; echo
          sha256sum p.pdf
          sudo apt-get install -y poppler-utils >/dev/null
          pdftotext -layout -enc UTF-8 p.pdf p.txt || true
          ls -l p.txt
      - uses: actions/upload-artifact@v4
        with:
          name: programa
          path: |
            p.pdf
            p.txt
